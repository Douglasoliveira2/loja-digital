# Somente para desenvolvimento local. Não use estas credenciais em produção.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja_dev_local
      POSTGRES_DB: loja
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
